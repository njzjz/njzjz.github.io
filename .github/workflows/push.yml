on:
  push:
    branches:
      - hexo
    tags:
      - v*
  pull_request:
name: Build and deploy on push
jobs:
  build:
    name: yarn install
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: yarn
    - run: npm install -g yarn
    - run: yarn install
    - run: yarn build
      if: github.ref != 'refs/heads/hexo'
      env:
        GH_TOKEN: ${{ secrets.ZENGLIB_TOKEN }}
